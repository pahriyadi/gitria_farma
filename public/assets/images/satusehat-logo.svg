<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="gradSatu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="158" height="48" rx="8" fill="url(#gradSatu)" stroke="#334155" stroke-width="1.5"/>
  <!-- Left Hospital Cross Icon Container -->
  <circle cx="26" cy="25" r="16" fill="#0d9488" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="1"/>
  <!-- Cross + Heart Path -->
  <rect x="23" y="17" width="6" height="16" rx="2" fill="url(#tealGrad)"/>
  <rect x="18" y="22" width="16" height="6" rx="2" fill="url(#tealGrad)"/>
  <circle cx="26" cy="25" r="2" fill="#ffffff"/>
  <!-- Text Section -->
  <text x="49" y="19" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" fill="#2dd4bf" letter-spacing="0.3">SATUSEHAT</text>
  <text x="49" y="30" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">KEMENKES RI</text>
  <text x="49" y="40" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#94a3b8">Platform RME Nasional</text>
</svg>
